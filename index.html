<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atlas TC de cuerpo entero</title>
<meta name="description" content="Atlas interactivo de TC de cuerpo entero para aprender anatomía radiológica: planos axial, coronal y sagital, 115 estructuras segmentadas, ventanas y niveles vertebrales clave. Whole-body CT atlas for learning cross-sectional anatomy.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2311171f' stroke='%234fd1c5' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f6c453'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="loading" id="loading">
  <div class="box">
    <h2 data-i="title">Atlas TC de cuerpo entero</h2>
    <p data-i="loading">Cargando el estudio (≈17 MB).</p>
    <div class="prog"><i id="progbar"></i></div>
    <div class="pct" id="progtxt">0%</div>
  </div>
</div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="row"><div class="kicker" data-i="kicker">Radiología · TC</div>
        <div class="lang" id="langSw" role="group" aria-label="Idioma / Language"><button data-lang="es">ES</button><button data-lang="en">EN</button></div></div>
      <h1 data-i="title">Atlas TC de cuerpo entero</h1>
      <div class="sub" id="seriesTxt"></div>
    </div>
    <div class="tabs" id="sideTabs" role="tablist">
      <button data-tab="atlas" class="on" role="tab" data-i="tabAtlas">Estructuras</button>
      <button data-tab="path" role="tab" data-i="tabPath">Patología</button>
    </div>
    <div class="pane" id="panePath" hidden></div>
    <div class="pane on" id="paneAtlas">
    <div class="card" id="card">
      <div class="t"><span class="dot" id="cDot"></span><div style="flex:1;min-width:0"><h3 id="cName"></h3><div class="en" id="cEn"></div></div><button class="x" id="cClose" data-it="close" aria-label="Cerrar">✕</button></div>
      <div class="meta" id="cMeta"></div>
      <div class="acts"><button class="btn" id="cGo" data-i="centre">Centrar</button><button class="btn" id="cIso" data-i="isolate">Aislar</button></div>
    </div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" data-ip="search" autocomplete="off" aria-label="Buscar">
    </div>
    <div class="sechead"><span data-i="systems">Sistemas</span><span class="mini"><button id="allOn" data-i="all">Todos</button><button id="allOff" data-i="none">Ninguno</button></span></div>
    <div class="systems" id="systems"></div>
    <div class="opacrow"><span data-i="opacity">Opacidad del color</span><input type="range" id="opac" min="0.1" max="0.9" step="0.05" value="0.45" aria-label="Opacidad"></div>
    <div class="list" id="list"></div>
    </div>
    <div class="foot"><span id="footTxt"></span><br><b data-i="disclaimer">Herramienta docente · no apta para uso clínico</b> · <a href="#" id="helpLink" data-i="help">Controles</a></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="bar">
      <button class="icon menuBtn" id="menuBtn" data-it="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="seg" id="planeSeg">
        <button data-p="axial" class="on" data-i="axial">Axial</button><button data-p="coronal" data-i="coronal">Coronal</button><button data-p="sagittal" data-i="sagittal">Sagital</button><button data-p="triple" data-i="triple">Triple</button>
      </div>
      <select class="wsel" id="winSel" data-it="winTitle"></select>
      <div class="seg" id="toolSeg" data-it="toolTitle">
        <button data-t="mover" class="on" data-i="pan">Mover</button><button data-t="ventana" data-i="window">Ventana</button><button data-t="medir" data-i="measure">Medir</button>
      </div>
      <div class="seg" id="ovSeg" data-it="ovTitle">
        <button data-o="fill" class="on" data-i="fill">Relleno</button><button data-o="outline" data-i="outline">Contorno</button><button data-o="none" data-i="nocolor">Sin color</button>
      </div>
      <div class="seg" id="lblSeg" data-it="lblTitle">
        <button data-l="all" class="on" data-i="labels">Etiquetas</button><button data-l="hover" data-i="onhover">Al pasar</button><button data-l="none" data-i="hidden">Ocultas</button>
      </div>
      <span class="grow"></span>
      <button class="icon" id="zOut" data-it="zoomOut">−</button>
      <button class="icon" id="zIn" data-it="zoomIn">+</button>
      <button class="icon" id="zFit" data-it="fit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon" id="linkBtn" data-it="copyLink"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
      <button class="icon hide-sm" id="helpBtn" data-it="help">?</button>
    </div>

    <div class="stage" id="stage">
      <div class="views single" id="views">
        <div class="view v-axial active" data-plane="axial"><canvas class="main"></canvas><div class="tag"><span data-i="axial">Axial</span><i></i></div><canvas class="scout" width="80" height="150" data-it="scoutTitle"></canvas></div>
        <div class="view v-coronal" data-plane="coronal"><canvas class="main"></canvas><div class="tag"><span data-i="coronal">Coronal</span><i></i></div></div>
        <div class="view v-sagittal" data-plane="sagittal"><canvas class="main"></canvas><div class="tag"><span data-i="sagittal">Sagital</span><i></i></div></div>
        <div class="view v-compare" data-plane="axial" data-slot="B"><canvas class="main"></canvas><div class="tag"><span data-i="compare">Comparar</span><i></i></div></div>
      </div>
      <div class="tip" id="tip"></div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="bottom">
      <div class="sl">
        <span class="lvl" id="lvl">—</span>
        <input type="range" id="slider" min="0" max="100" value="50" aria-label="Corte">
        <span class="lbl" id="sliceTxt"></span>
      </div>
      <div class="keys" id="keys"><span class="kt" data-i="keyLevels">Niveles clave</span></div>
    </div>
  </main>
</div>

<div class="modal" id="help" role="dialog" aria-modal="true">
  <div class="box">
    <h2 data-i="help">Controles</h2>
    <table id="helpTable"></table>
    <p id="helpNote"></p>
    <div style="text-align:right"><button class="btn" id="helpClose" data-i="close">Cerrar</button></div>
  </div>
</div>

<script type="module" src="src/ui.js"></script>
</body>
</html>
